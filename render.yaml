# Render Blueprint: runs the whole VIPER app (FastAPI + WebSocket + static
# frontend) as one free web service at one URL.
# Deploy: render.com -> New -> Blueprint -> select this GitHub repo.
services:
  - type: web
    name: viperconcept
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python backend/main.py
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: VIPER_HOST
        value: 0.0.0.0
      # Free instances have an ephemeral disk: incident history resets on
      # every restart/redeploy. That is acceptable for a simulation demo.
      - key: VIPER_DB_PATH
        value: /tmp/viper.db
